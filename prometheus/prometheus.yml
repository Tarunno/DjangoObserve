global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: django
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:8000
        labels:
          app: django

  - job_name: postgres
    static_configs:
      - targets:
          - postgres_exporter:9187

  - job_name: celery
    static_configs:
      - targets:
          - celery_exporter:9808

  - job_name: otel-collector
    static_configs:
      - targets:
          - otel-collector:8888
