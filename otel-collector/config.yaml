# Receives OTLP from Django / Celery and writes traces + logs to OpenSearch hot nodes.
# Metrics stay on Prometheus (django-prometheus / exporters). Debug exporter is a local sanity check.

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
    path: /health
  basicauth/opensearch:
    client_auth:
      username: ${env:OPENSEARCH_USERNAME}
      password: ${env:OPENSEARCH_PASSWORD}

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 100
  batch:
    timeout: 5s
    send_batch_size: 1024

exporters:
  debug:
    verbosity: basic
  opensearch:
    http:
      endpoint: ${env:OPENSEARCH_ENDPOINT}
      auth:
        authenticator: basicauth/opensearch
      tls:
        insecure_skip_verify: true
      timeout: 30s
    dataset: djangoobserve
    namespace: default
    mapping:
      mode: ss4o
    retry_on_failure:
      enabled: true
      max_elapsed_time: 300s
    sending_queue:
      enabled: true

service:
  extensions: [health_check, basicauth/opensearch]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
                without_type_suffix: true
                without_units: true
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug, opensearch]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug, opensearch]
