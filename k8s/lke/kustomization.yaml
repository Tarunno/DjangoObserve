apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
resources:
  - namespace.yaml
  - opensearch-cluster.yaml
  - otel-collector.yaml
configMapGenerator:
  - name: otel-collector-config
    files:
      - config.yaml=../../otel-collector/config.yaml
    options:
      disableNameSuffixHash: true
